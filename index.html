<script>
/* Hardwood GM — simulation engine (no DOM). Works in browser and Node. */
(function (root) {
'use strict';

/* ---------- random helpers ---------- */
const R = {
  int: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: a => a[Math.floor(Math.random() * a.length)],
  norm: () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
  shuffle: a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  poisson: l => { const L = Math.exp(-Math.max(0.01, l)); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }
};
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const has = v => v != null && String(v).trim() !== '';
function seasonLabel(y) { return `${y}-${String(y + 1).slice(2)}`; }

/* ---------- league history ---------- */
// [franchise key, abbr, city, nickname, Basketball-Reference codes used in the 1975-76 tables and the 1976 draft]
const TEAMS_1976 = [
  ['atl', 'ATL', 'Atlanta', 'Hawks', ['ATL']],

  const list = (L.offers || []).filter(o => G.offerValid(L, o));
  if (!list.length) return '';
  const items = pkg => (pkg.players || []).map(id => { const p = L.players[id]; return `<li><span class="pos">${esc(p.pos)}</span> ${esc(p.name)} <span class="small">age ${p.age}</span> ${rating(p.ovr)} ${rating(G.shownPot(L, p))}</li>`; })
    .concat((pkg.picks || []).map(id => { const k = G.pickById(L, id); return `<li><span class="pos pk">PICK</span> ${esc(G.pickLabel(L, k))} <span class="small">≈#${G.projectedOverall(L, k)}</span></li>`; })).join('');
  return `<section class="card offers"><h3>Trade offers (${list.length})</h3>${list.map(o => `
    <div class="offer"><div class="split"><b>${esc(tname(L.teams[o.from]))}${o.block ? ' <span class="small">· trading block</span>' : ''}</b><span class="small">${o.exp >= 0 ? `Expires in ${Math.max(1, o.exp - L.day)} days` : 'Expires on opening night'}</span></div>
      ${o.sat ? `<p class="small"><b>Sign-and-trade:</b> ${esc(L.players[o.sat.pid].name)} signs ${o.sat.yrs} years at ${G.money(o.sat.sal)}, then goes to ${esc(L.teams[o.from].abbr)}.</p>` : ''}<div class="trade"><div><div class="eyebrow">You get</div><ul class="olist">${items(o.give)}</ul></div><div><div class="eyebrow">You give</div><ul class="olist">${items(o.get)}</ul></div></div>
      <div class="row"><button class="btn primary sm" data-act="acceptOffer" data-id="${o.id}">Accept</button><button class="btn sm" data-act="rejectOffer" data-id="${o.id}">Reject</button></div></div>`).join('')}
    <p class="small">Ratings shown are OVR then POT.</p></section>`;
}

/* ---------- Next draft class: scouted through the season ---------- */
function skillLine(p) {
  const pr = p.prof; if (!pr) return '';
  const g = (v, lo, hi) => Math.max(20, Math.min(99, Math.round(30 + 60 * (v - lo) / (hi - lo))));
  const k = v => Math.max(25, Math.min(99, Math.round(p.pot + (v - 60) * 0.5)));
  const sk = [['Scoring', g(pr.pts, 8, 28)], ['Rebounding', g(pr.reb, 3, 13)], ['Passing', g(pr.ast, 1, 9)], ['Defense', g(pr.stl * 1.5 + pr.blk, 0.8, 4)], ['Shooting', g(pr.ft || 0.7, 0.6, 0.9)]];
  return `<div class="skills">${sk.map(([n, v]) => `<span class="sk"><span class="lbl">${n}</span>${rating(k(v))}</span>`).join('')}</div>`;
}
function classCard() {
  const B = G.classBoard(L); if (!B || ['draft', 'offseason'].includes(L.phase)) return '';
  const done = B.list.filter(p => !p.unsc), tot = B.list.length, open = !!ui.clsOpen, grp = ui.clsGrp || 'ALL';
  const rank = {}; done.slice().sort((a, b) => b.scout - a.scout).forEach((p, i) => rank[p.id] = i + 1);
  const list = (open ? B.list : done).filter(p => grp === 'ALL' || p.pos === grp).sort((a, b) => (a.unsc ? 1 : 0) - (b.unsc ? 1 : 0) || b.scout - a.scout || a.name.localeCompare(b.name));
  const show = open ? list.slice(0, ui.clsShow || 40) : list.slice(0, 8);
  const status = L.phase === 'preseason' || L.phase === 'dispersal' ? 'Scouts start filing reports when the season begins, a few every week.'
    : done.length < tot ? `${done.length} of ${tot} prospects graded. More reports come in every week; everyone is graded by the end of the regular season.` : 'Every prospect is graded. At the draft you get workouts to see true potential and skills.';
  const row = p => `<div class="pl"><div class="pl-main"><span class="pos">${esc(p.pos)}</span><div class="pl-name">${p.unsc ? '' : `<span class="small">#${rank[p.id]}</span> `}${esc(p.name)}${!p.unsc && B.wk > 0 && p.scWk === B.wk ? ' <span class="tag new">NEW</span>' : ''}<div class="pl-sub">${esc(p.college || '')} · age ${p.age}${p.realPick && p.realPick.pick ? ` · real: #${p.realPick.pick} ${esc(p.realPick.tm)}` : ''}</div></div>
    <div class="pl-r"><span class="lbl">SCOUT</span>${p.unsc ? '<span class="rt none">—</span>' : rating(p.scout)}</div></div></div>`;
  return `<section class="card"><div class="split"><h3>${B.y} draft class</h3><span class="count">${done.length} / ${tot}</span></div><p class="small">${status}</p>
    ${open ? `<div class="chips">${['ALL'].concat(G.POS).map(g => `<button class="chip ${grp === g ? 'on' : ''}" data-act="chip" data-key="clsGrp" data-id="${g}">${g === 'ALL' ? 'All' : g}</button>`).join('')}</div>` : ''}
    <div class="list">${show.length ? show.map(row).join('') : '<p class="small">No reports yet.</p>'}</div>
    <div class="row"><button class="btn sm" data-act="clsOpen">${open ? 'Show top 8' : 'Full board'}</button>${open && list.length > show.length ? `<button class="btn sm" data-act="clsMore">Show more</button>` : ''}</div></section>`;
}

/* ---------- Draft ---------- */
function vDraft() {
  const D = L.draft, c = G.onClock(L), n = D.n, started = D.started !== false, visits = D.visits || 0;
  if (c === null) return `<section class="card hero"><div class="eyebrow">${D.year} draft</div><h2>All ${D.rounds} rounds are complete</h2><div class="row"><button class="btn primary" data-act="endDraft">Finish the draft</button></div></section>` + myPicks();
  const rnd = Math.floor(D.pick / n) + 1, pk = D.pick % n + 1, mine = started && c === L.user;
  const slots = G.myDraftSlots(L), ord = slots.length ? 'at #' + slots.slice(0, 8).join(', #') + (slots.length > 8 ? ` and ${slots.length - 8} more` : '') : 'nowhere (you traded all your picks)';
  const visitTxt = `<b>${visits}</b> of ${D.maxVisits || G.SCOUT_VISITS} workouts left`;
  const lot = (D.lottery || []).filter(j => j.to <= 4);
  const lotTxt = lot.length ? `<p class="small"><b>${D.kind === 'flip' ? 'Coin flip' : 'Lottery'}:</b> ${lot.map(j => `#${j.to} ${esc(L.teams[j.id].abbr)}${j.from !== j.to ? ` (was #${j.from})` : ''}`).join(', ')}.</p>` : '';
  let h;
  if (!started) {
    h = `<section class="card hero"><div class="eyebrow">${D.year} draft · Workout week</div><h2>Bring prospects in</h2>
      <p>${visitTxt}. A workout reveals a prospect's true potential and his skills. Every other team gets workouts too, and they use what they learn.</p>${lotTxt}
      <p class="small">Your picks: ${ord}. Scout grades come from projected draft slot and college, not from how careers turned out. Unused workouts don't carry over.</p>
      <div class="row"><button class="btn primary" data-act="beginDraft">Begin the draft</button></div></section>`;
  } else {
    h = `<section class="card hero"><div class="eyebrow">${D.year} draft · Round ${rnd} of ${D.rounds} · Pick ${pk} (#${D.pick + 1} overall)</div>
      <h2>${mine ? 'You are on the clock' : esc(tname(L.teams[c])) + ' are picking'}</h2>${lotTxt}
      <p class="small">Your picks: ${ord} · ${visitTxt}.</p>
      <div class="row">${mine ? '<button class="btn" data-act="autoPick">Let scouts pick</button><button class="btn" data-act="shopPick">Shop this pick</button>' : `<button class="btn primary" data-act="toMyPick">Sim to my pick</button><button class="btn" data-act="callPick">Call ${esc(L.teams[c].city)} about #${D.pick + 1}</button>`}<button class="btn" data-act="draftRest">Auto-draft the rest</button></div>
      <p class="small">${mine ? 'Shop this pick to see what teams will give you to move down. Offers appear above.' : 'To move up, call the team on the clock: the Moves tab opens with their pick selected, so you can add what you would give.'}</p></section>`;
  }
  const show = ui.draftShow || 60;
  const all = D.pool.map(i => L.players[i]).filter(p => ui.draftGrp === 'ALL' || (ui.draftGrp === 'SEEN' ? p.seen : p.pos === ui.draftGrp)).sort((a, b) => b.scout - a.scout);
  const pool = all.slice(0, show);
  const chipRow = `<div class="chips">${['ALL', 'SEEN'].concat(G.POS).map(g => `<button class="chip ${ui.draftGrp === g ? 'on' : ''}" data-act="chip" data-key="draftGrp" data-id="${g}">${g === 'ALL' ? 'All' : g === 'SEEN' ? 'Worked out' : g}</button>`).join('')}</div>`;
  h += `<section class="card"><div class="split"><h3>Draft board</h3><span class="small">${all.length} prospects</span></div>${chipRow}<div class="list">${pool.length ? pool.map(p => `
    <div class="pl"><div class="pl-main"><span class="pos">${esc(p.pos)}</span><div class="pl-name">${esc(p.name)}<div class="pl-sub">${esc(p.college || '')} · age ${p.age}${p.realPick && p.realPick.pick ? ` · real: #${p.realPick.pick} ${esc(p.realPick.tm)}` : ''}</div></div>
    <div class="pl-r"><span class="lbl">SCOUT</span>${rating(p.scout)}</div>${p.seen ? `<div class="pl-r"><span class="lbl">TRUE</span>${rating(p.pot)}</div>` : ''}</div>${p.seen ? skillLine(p) : ''}
    <div class="pl-btns">${!p.seen && visits > 0 ? `<button class="btn sm" data-act="scout" data-id="${p.id}">Work out</button>` : ''}${mine ? `<button class="btn sm primary" data-act="draftPick" data-id="${p.id}">Draft</button>` : ''}</div></div>`).join('') : `<p>${ui.draftGrp === 'SEEN' ? 'You have not worked out anyone still on the board.' : 'No prospects at this position.'}</p>`}</div>
    ${all.length > show ? `<div class="row"><button class="btn" data-act="draftMore">Show ${Math.min(60, all.length - show)} more</button></div>` : ''}</section>`;
  return h + myPicks();
}
function myPicks() {
  const mine = L.draft.log.filter(x => x.tid === L.user);
  if (!mine.length) return '';
  return `<section class="card"><h3>Your class</h3><div class="list">${mine.map(x => { const p = L.players[x.pid]; return `<div class="pl"><div class="pl-main"><span class="pos">${esc(p.pos)}</span><div class="pl-name">${esc(p.name)}<div class="pl-sub">Round ${p.draft.rnd}, #${x.n} overall · ${G.money(p.con ? p.con.sal : 0)}</div></div><div class="pl-r"><span class="lbl">${p.seen ? 'TRUE' : 'SCOUT'}</span>${rating(p.seen ? p.pot : p.scout)}</div></div></div>`; }).join('')}</div></section>`;
}

/* ---------- Contracts ---------- */
function conText(p) {
  if (!p.con) return 'No contract';
  if (!G.onBooks(p, G.capYear(L))) return `<b class="warn">Expiring</b>`;
  if (p.con.ext) return `${G.money(p.con.sal)} thru ${SL(p.con.exp)}, then ${G.money(p.con.ext.sal)} thru ${SL(p.con.ext.exp)}`;
  return `${G.money(p.con.sal)} thru ${SL(p.con.exp)}${G.extInfo(L, p) ? ' · <b class="warn">final year</b>' : ''}`;
}
function payrollCard() {
  const y = G.capYear(L), cap = G.capFor(y), pay = G.payroll(L, L.user, y), tax = G.taxLine(y);
  const top = tax || cap, pct = top ? Math.min(100, pay / (tax ? tax * 1.1 : cap) * 100) : 0;
  let note;
  if (!cap) note = `No salary cap until 1984-85. League average salary is about ${G.money(G.avgSalary(y))}`;
  else {
    const space = cap - pay;
    note = space > 0 ? `${G.money(space)} in cap space` : `Over the cap by ${G.money(-space)}. You can still re-sign your own players; outside free agents need the minimum${G.mleFree(L, L.user, y) ? ` or your mid-level exception (${G.money(G.mleAmount(y))})` : ''}`;
    const fl = G.floorFor(y); if (fl) note += pay < fl ? `. <b class="warn">Under the ${G.money(fl)} salary floor by ${G.money(fl - pay)}; if you stay under, the gap is paid to your players at season's end</b>` : `. Salary floor: ${G.money(fl)}`;
    if (tax) note += pay > tax ? `. <b class="bad">Over the luxury tax line (${G.money(tax)}) by ${G.money(pay - tax)}; the owner pays that again in tax.</b>` : `. Luxury tax line: ${G.money(tax)}`;
  }
  return `<section class="card"><div class="split"><h3>${SL(y)} payroll</h3><span class="count">${G.money(pay)}${cap ? ' / ' + G.money(cap) : ''}</span></div>
    ${cap ? `<div class="bar-t cap"><span class="bar-f ${tax && pay > tax ? 'g-low bad' : pay > cap ? 'warn' : 'g-good'}" style="width:${pct}%"></span></div>` : ''}
    <p class="small">${note}.</p></section>`;
}
function faCard() {
  if (L.phase !== 'offseason') return '';
  G.ensureFA(L);
  const F = L.fa, y = F.y, info = G.ERA_INFO[F.era];
  const prow = (p, extra, btns) => `<div class="pl wide"><div class="pl-main"><span class="pos">${esc(p.pos)}</span><div class="pl-name">${esc(p.name)}<div class="pl-sub">Age ${p.age + 1} in ${SL(y)} · ${(p.yrs || 0) + 1} yrs exp${extra ? ' · ' + extra : ''}</div></div>
    <div class="pl-r"><span class="lbl">OVR</span>${rating(p.ovr)}</div><div class="pl-r"><span class="lbl">${G.potKnown(L, p) ? 'POT' : 'SCOUT'}</span>${rating(G.shownPot(L, p))}</div></div><div class="pl-btns">${btns}</div></div>`;
  let h = `<section class="card offers"><div class="eyebrow">${SL(y)} offseason · ${esc(info.name)}</div><h3>Contracts &amp; free agency</h3><p class="small">${esc(info.text)}</p>
    <div class="ctbar"><span class="lbl">POSITION</span>${chips('ctGrp', ui.ctGrp || 'ALL')}${sortSeg('ctSort', true, 'pos')}</div>`;
  F.sheets.forEach((sh, i) => {
    const p = L.players[sh.pid], picks = G.compPicks(L, sh.sal).map(r => 'a round ' + r + ' pick').join(' and ');
    h += `<div class="offer"><b>${esc(L.teams[sh.from].city)}</b> offer sheet for your ${esc(p.pos)} ${esc(p.name)}: ${sh.yrs} yrs, ${G.money(sh.sal)} a year.
      <div class="row"><button class="btn sm primary" data-act="matchSheet" data-id="${i}">Match</button><button class="btn sm" data-act="declineSheet" data-id="${i}">Let him go${picks ? ' for ' + picks : ''}</button></div></div>`;
  });
  const ufa = F.era === 'ufa';
  if (ufa) h += marketHeader(F);
  const exp = (ufa && F.round > 0) ? [] : ctFilter(G.expiring(L, L.user).filter(p => !F.sheets.some(s => s.pid === p.id)));
  if (!(ufa && F.round > 0)) {
    h += `<h3 class="sub">Your expiring contracts (${exp.length})</h3>`;
    h += exp.length ? `<div class="list">${exp.map(p => {
      const rfa = G.isRestricted(L, p), price = rfa ? G.tenderPrice(L, p) : G.resignPrice(L, p);
      const why = ufa && !rfa ? reasonsText(G.fitFor(L, p, L.user).reasons) : '';
      const btns = `<button class="btn sm primary" data-act="resign" data-id="${p.id}">${rfa ? 'Qualifying offer' : 'Re-sign'} ${G.money(price)}</button><button class="btn sm" data-act="letGo" data-id="${p.id}">Let go</button>${G.satAllowed(L) ? `<button class="btn sm" data-act="sat" data-id="${p.id}">Sign-and-trade</button>` : ''}`;
      return prow(p, (rfa ? 'Restricted' : (ufa ? 'Unrestricted · market value ' + G.money(G.marketValue(L, p)) : 'Asking ' + G.money(price))) + why, btns);
    }).join('')}</div><p class="small">${ufa ? 'This is your exclusive window. Once free agency starts, unrestricted players you haven\'t re-signed hit the open market, where you can still bid but other teams will too. Re-signing your own players is allowed even over the cap.' : 'Anyone you don\'t handle re-signs at his asking price when the season starts.'}</p>` : '<p class="small">None. Everyone is signed for next season.</p>';
  }
  if (ufa) h += marketList(F);
  if (F.era === 'comp' || F.era === 'rfr') {
    const tg = ctFilter(G.sheetTargets(L).filter(p => !F.done[p.id])).slice(0, 25);
    if (tg.length) h += `<h3 class="sub">Offer sheet targets</h3><p class="small">Unsigned players on other teams. If his team doesn't match, he's yours${F.era === 'comp' ? ' and you give up the draft picks shown' : ''}.</p><div class="list">${tg.map(p => { const sal = Math.round(G.askPrice(L, p) * 1.2); const cp = G.compPicks(L, sal); return prow(p, esc(L.teams[p.team].abbr) + (cp.length ? ' · costs ' + cp.map(r => 'R' + r).join('+') : ''), `<button class="btn sm" data-act="sheet" data-id="${p.id}">Offer ${G.money(sal)}</button>`); }).join('')}</div>`;
  }
  return h + '</section>';
}
function reasonsText(rs) {
  if (!rs || !rs.length) return '';
  return '<br>' + rs.map(([s, t]) => `<span class="${s === '+' ? 'good' : 'bad'}">${s === '+' ? '▲' : '▼'} ${esc(t)}</span>`).join(' · ');
}
function marketHeader(F) {
  const done = F.round > G.FA_ROUNDS;
  const label = F.round === 0 ? 'Exclusive window' : (done ? 'Free agency is over' : `Bidding round ${F.round + 1} of ${G.FA_ROUNDS}`);
  const btn = done ? '' : `<button class="btn primary" data-act="advanceFA">${F.round === 0 ? 'Start free agency (resolve round 1)' : `Resolve round ${F.round + 1}`}</button>`;
  const mine = (F.last || []).filter(x => x.tid === L.user), lost = (F.last || []).filter(x => x.tid !== L.user && x.bidders.includes(L.user));
  const nb = Object.keys(F.bids || {}).length;
  return `<div class="faround"><div class="split"><b>${label}</b><span class="small">${nb} bid${nb === 1 ? '' : 's'} placed</span></div>
    ${F.last ? `<p class="small">Last round: ${F.last.length} players signed. ${mine.length ? `<span class="good">You signed ${mine.map(x => esc(L.players[x.pid].name)).join(', ')}.</span>` : ''} ${lost.length ? `<span class="bad">You lost ${lost.map(x => esc(L.players[x.pid].name) + ' to ' + esc(L.teams[x.tid].abbr)).join(', ')}.</span>` : ''}</p>` : ''}
    <p class="small">Each round, every free agent picks the best offer: money and years, plus team record, style fit, playing time, and loyalty. Anyone who doesn't sign lowers his price for the next round. After round ${G.FA_ROUNDS}, leftovers sign cheaply with whoever has room.</p>
    <div class="row">${btn}</div></div>`;
}
function ctFilter(list) { const g = ui.ctGrp || 'ALL'; return list.filter(p => g === 'ALL' || p.pos === g).sort(cmp(ui.ctSort || 'pos')); }
function marketList(F) {
  if (F.round > G.FA_ROUNDS) return '';

  const rows = list.map(p => {
    const b = F.bids && F.bids[p.id], ask = G.baseAsk(L, p), o = b ? G.bidOutlook(L, p.id) : null, fit = G.fitFor(L, p, L.user);
    const bidUI = b ? `<div class="bid"><span>Your bid <b>${G.money(b.sal)}</b> × <b>${b.yrs}</b> yr${b.yrs > 1 ? 's' : ''}</span>
        <span class="bidctl"><button class="btn sm ar" data-act="bid" data-id="${p.id}" data-key="sal-">−$</button><button class="btn sm ar" data-act="bid" data-id="${p.id}" data-key="sal+">+$</button><button class="btn sm ar" data-act="bid" data-id="${p.id}" data-key="yrs-">−yr</button><button class="btn sm ar" data-act="bid" data-id="${p.id}" data-key="yrs+">+yr</button><button class="btn sm" data-act="bid" data-id="${p.id}" data-key="x">Withdraw</button></span>
        <span class="small ${o && o.label.startsWith('Below') ? 'bad' : 'good'}">${o ? esc(o.label) + ` · ${o.teams ? `about ${o.teams} other team${o.teams === 1 ? '' : 's'} likely to bid` : 'no other teams likely to bid'}` : ''}</span></div>`
      : `<button class="btn sm primary" data-act="bid" data-id="${p.id}" data-key="new">Bid ${G.money(ask)}</button>`;
    return `<div class="pl wide"><div class="pl-main"><span class="pos">${esc(p.pos)}</span><div class="pl-name">${esc(p.name)}<div class="pl-sub">Age ${p.age + 1} · ${p.prevTeam != null && L.teams[p.prevTeam] ? 'was ' + esc(L.teams[p.prevTeam].abbr) + ' · ' : ''}asking ${G.money(ask)}${reasonsText(fit.reasons)}</div></div>
      <div class="pl-r"><span class="lbl">OVR</span>${rating(p.ovr)}</div><div class="pl-r"><span class="lbl">${G.potKnown(L, p) ? 'POT' : 'SCOUT'}</span>${rating(G.shownPot(L, p))}</div></div><div class="pl-btns">${bidUI}</div></div>`;
  }).join('');
  return `<h3 class="sub">Free agent market</h3><div class="list">${rows || '<p class="small">No free agents at this position.</p>'}</div><div class="row"><button class="btn" data-act="mktMore">Show more</button></div>`;
}
function extCard() {
  const el = G.roster(L, L.user).map(p => [p, G.extInfo(L, p)]).filter(x => x[1]).sort((a, b) => b[0].ovr - a[0].ovr);
  if (!el.length) return '';
  return `<section class="card"><h3>Extensions</h3><p class="small">These players are in the last year of their deals. Extend them now, or they reach free agency after the season. Their price depends on how they feel about your team.</p>
    <div class="list">${el.map(([p, x]) => `<div class="pl wide"><div class="pl-main"><span class="pos">${esc(p.pos)}</span><div class="pl-name">${esc(p.name)}<div class="pl-sub">Age ${p.age} · now ${G.money(p.con.sal)} · market ${G.money(G.marketValue(L, p, x.from))}${reasonsText(x.fit.reasons)}</div></div>
      <div class="pl-r"><span class="lbl">OVR</span>${rating(p.ovr)}</div><div class="pl-r"><span class="lbl">${G.potKnown(L, p) ? 'POT' : 'SCOUT'}</span>${rating(G.shownPot(L, p))}</div></div>
      <div class="pl-btns"><button class="btn sm primary" data-act="extend" data-id="${p.id}">Extend ${x.yrs} yr${x.yrs > 1 ? 's' : ''} at ${G.money(x.sal)}</button></div></div>`).join('')}</div></section>`;
}

/* ---------- Sorting ---------- */
function cmp(key) {
  if (key === 'pos') return (a, b) => G.POS.indexOf(a.pos) - G.POS.indexOf(b.pos) || b.ovr - a.ovr;
  return key === 'pot' ? (a, b) => G.shownPot(L, b) - G.shownPot(L, a) || b.ovr - a.ovr : (a, b) => b.ovr - a.ovr || G.shownPot(L, b) - G.shownPot(L, a);
}
function sortSeg(stateKey, withPos, def) {
  const cur = ui[stateKey] || def || 'ovr';
  const opts = (withPos ? [['pos', 'Position']] : []).concat([['ovr', 'Overall'], ['pot', 'Potential / Scout']]);
  return `<div class="sortrow"><span class="lbl">SORT</span><div class="seg mini">${opts.map(([k, n]) => `<button class="${cur === k ? 'on' : ''}" data-act="sort" data-key="${stateKey}" data-id="${k}">${n}</button>`).join('')}</div></div>`;
}

/* ---------- Roster ---------- */

/* ---------- League ---------- */
function divTable(conf, div) {
  const list = L.teams.filter(t => t.conf === conf && t.div === div), teams = G.sortTeams(L, list);
  return `<section class="card"><h3>${div} Division</h3><table class="tbl"><thead><tr><th>Team</th><th>W</th><th>L</th><th>PCT</th><th>GB</th></tr></thead><tbody>
    ${teams.map(t => { const gb = G.gamesBack(L, t, list); return `<tr class="${t.id === L.user ? 'me' : ''}"><td>${esc(tname(t))}</td><td>${t.w}</td><td>${t.l}</td><td>${t.w + t.l ? (t.w / (t.w + t.l)).toFixed(3).replace(/^0/, '') : '–'}</td><td>${gb ? f1(gb).replace('.0', '') : '–'}</td></tr>`; }).join('')}</tbody></table></section>`;
}
function vLeague() { return (ui.box ? boxCard(ui.box) : '') + vLeagueInner(); }
function vLeagueInner() {
  const seg = [['stand', 'Standings'], ['lead', 'Leaders'], ['res', 'Results'], ['po', 'Playoffs'], ['hist', 'History']];

    }
    const ru = G.rules(L.year);
    h += `<p class="small">${ru.poTeams} teams per conference make the playoffs${ru.byes ? ', and the two division winners get first-round byes' : ''}${ru.playIn ? ', with seeds 7 through 10 in the play-in tournament' : ''}. First round: best of ${ru.r1Len}.</p>`;
  }

      ${top.length ? top.map((x, i) => `<tr class="${x.tm === L.user ? 'me' : ''}"><td>${i + 1}</td><td class="l"><button class="lnk" data-act="statPlayer" data-id="${x.p.id}">${esc(x.p.name)}</button></td><td>${x.tm != null && L.teams[x.tm] ? esc(L.teams[x.tm].abbr) : 'FA'}</td><td>${fmtv(x.v)}</td></tr>`).join('') : '<tr><td colspan="4">No qualified players yet this season.</td></tr>'}</tbody></table>

  }

        <div class="seg mini"><button class="${mineOnly ? 'on' : ''}" data-act="resMine" data-id="1">My games</button><button class="${mineOnly ? '' : 'on'}" data-act="resMine" data-id="0">All games</button></div>`;
      let body = '';
      for (let d = w * 7; d < Math.min(played, w * 7 + 7); d++) {

        if (gs.length) body += `<div class="eyebrow">Day ${d + 1}</div>` + gs.map(([g, gi]) => gameLine(g, `d:${d}:${gi}`)).join('');

    h += `<section class="card"><h3>Champions</h3>${L.champs.length ? `<table class="tbl"><tbody>${L.champs.map(c => `<tr class="${c.champ === L.user ? 'me' : ''}"><td>${SL(c.y)}</td><td class="l">${esc(tname(L.teams[c.champ]))}</td><td class="l small">over ${esc(L.teams[c.loser].abbr)}</td><td>${c.score}</td></tr>`).join('')}</tbody></table>` : '<p>No champions crowned yet.</p>'}</section>`;
    const hs = me().hist.slice().reverse();
    h += `<section class="card"><h3>${esc(me().name)} by season</h3>${hs.length ? `<table class="tbl"><tbody>${hs.map(s => `<tr><td>${SL(s.y)}</td><td>${s.w}-${s.l}</td><td class="l">${esc(s.res)}</td></tr>`).join('')}</tbody></table>` : '<p>Your first season is under way.</p>'}</section>`;
  }
  return h;
}

  const posSel = (side, cur) => `<label class="fld tpos">Position<select id="tGrp-${side}">${['ALL'].concat(G.POS).map(g => `<option value="${g}"${cur === g ? ' selected' : ''}>${g === 'ALL' ? 'All positions' : g}</option>`).join('')}</select></label>`;
  const btnP = (p, side) => { const key = 'p:' + p.id, on = ui[side].includes(key); return `<button class="tp ${on ? 'on' : ''}" data-act="tp" data-side="${side}" data-id="${key}"><span class="pos">${esc(p.pos)}</span><span class="tp-n">${esc(p.name)}</span><span class="tp-a">${capOn ? G.money(G.salFor(p, G.capYear(L)) || 0) : p.age}</span>${rating(showPot ? G.shownPot(L, p) : p.ovr)}</button>`; };

    <label class="fld">Position you need<select id="blockPos">${['ALL'].concat(G.POS).map(g => `<option value="${g}"${(ui.blockPos || 'ALL') === g ? ' selected' : ''}>${g === 'ALL' ? 'Any position' : g}</option>`).join('')}</select></label>
    <div class="row"><button class="btn primary" data-act="shopBlock"${ui.give.length ? '' : ' disabled'}>Find offers for ${ui.give.length ? ui.give.length + ' item' + (ui.give.length > 1 ? 's' : '') : 'what you send'}</button></div>
    ${ui.give.length ? '' : '<p class="small">Pick players or picks under You send first.</p>'}</section>`;
  return h;
}

/* ---------- Coach ---------- */
function lineupCard(c, r, custom) {
  const y = L.year, rg = G.posRigidity(y), be = G.bigEra(y);
  const era = rg >= 0.9 ? ['Set positions', 'Teams need a true center and a real point guard, and a great big man is the surest way to win. Small lineups get hurt inside and on the glass.']
    : rg >= 0.6 ? ['Positions loosening', 'Centers and point guards still matter, but a lineup without one costs less every year, and spacing the floor is starting to pay.']
    : ['Positionless era', 'Five players who can handle, shoot, and switch can beat size. Going without a center or point guard costs little, and great guards drive winning more than great bigs.'];
  const meter = (n, v) => `<div class="bar"><span class="bar-l">${n}</span><span class="bar-t"><span class="bar-f g-good" style="width:${Math.round(v * 100)}%"></span></span><span class="bar-v">${Math.round(v * 10)}</span></div>`;
  const base = r.off + r.def, opt = k => { const x = G.ratings(L, L.user, Object.assign({}, c, { lineup: k })); return { o: x.off - r.off, d: x.def - r.def }; };
  const sg = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1);
  const notes = (r.pos && r.pos.notes) || [];
  return `<section class="card"><h3>Lineup</h3><div class="eyebrow">${SL(y)} · ${era[0]}</div><p class="small">${era[1]}</p>
    ${meter('Big men matter', be)}${meter('Position flexibility', 1 - rg)}
    <div class="list">${Object.keys(G.LINEUPS).map(k => { const o = G.LINEUPS[k], on = G.lineupFor(c) === k, d = on || custom ? null : opt(k);
      return `<button class="tp ${on ? 'on' : ''} offopt" data-act="coach" data-key="lineup" data-id="${k}"><span class="pl-name">${esc(o.name)}${d ? ` <span class="small ${d.o + d.d > 0.3 ? 'good' : d.o + d.d < -0.3 ? 'bad' : ''}">${sg(d.o)} off · ${sg(d.d)} def vs now</span>` : ''}<span class="pl-sub">${esc(o.desc)}</span></span>${on ? '<span class="award">Using</span>' : ''}</button>`; }).join('')}</div>
    ${notes.length ? `<p class="small"><b>Your starting five right now:</b> ${notes.map(n => `${esc(n.t)} (${[n.o ? sg(n.o) + ' off' : '', n.d ? sg(n.d) + ' def' : ''].filter(Boolean).join(', ')})`).join('; ')}.</p>` : '<p class="small"><b>Your starting five right now:</b> no positional penalties or bonuses.</p>'}
    ${custom ? '<p class="small">You set your own rotation order, so the lineup style is not picking your starters. Its effects still apply to whoever starts. Tap Auto in Rotation to let the style choose.</p>' : ''}</section>`;
}
function vCoach() {
  const c = me().coach, r = G.ratings(L, L.user);
  G.ensureStaff(L);
  const st = me().staff, win = G.coachWindow(L), sb = G.staffBonus(L, L.user);
  const prefTxt = x => x.role === 'oc' ? 'Prefers ' + (OFF[x.pref] || 'balanced').toLowerCase() + ' offense' : x.role === 'dc' ? 'Prefers ' + (DEF[x.pref] || x.pref).toLowerCase() : 'Game night and player development';
  const match = x => (x.role === 'oc' && x.pref === c.off) || (x.role === 'dc' && x.pref === c.def);
  const staffRows = ['hc', 'oc', 'dc'].map(role => { const x = st[role];
    return x ? `<div class="pl wide"><div class="pl-main"><span class="pos">${role.toUpperCase()}</span><div class="pl-name">${esc(x.name)}${x.interim ? ' <span class="small">(interim)</span>' : ''}${x.former ? ` <span class="tag">Former ${esc(x.former.pos)}</span>` : ''}<div class="pl-sub">${G.ROLE_NAME[role]} · age ${x.age} · ${prefTxt(x)}${role !== 'hc' ? (match(x) ? ' · <span class="good">matches your scheme</span>' : ' · <span class="warn">scheme mismatch, half effect</span>') : ''}</div></div><div class="pl-r"><span class="lbl">RTG</span>${rating(x.r)}</div></div>
      ${win ? `<div class="pl-btns">${confirmBtn('fire' + role, 'Fire')}</div>` : ''}</div>`
      : `<div class="pl wide"><div class="pl-main"><span class="pos">${role.toUpperCase()}</span><div class="pl-name"><b class="bad">Vacant</b><div class="pl-sub">${G.ROLE_NAME[role]}. Hire one below before opening night, or an interim coach takes over.</div></div></div></div>`; }).join('');
  const open = ['hc', 'oc', 'dc'].filter(role => !st[role]);
  const pool = open.length && win ? L.coachPool.filter(x => open.includes(x.role)).sort((a, b) => b.r - a.r).slice(0, 15) : [];
  const poolRows = pool.map(x => { const pr = G.coachAcceptP(L, x, L.user), lk = pr >= 0.75 ? 'Interested' : pr >= 0.4 ? 'Might listen' : 'Unlikely'; const dec = x.decl && x.decl[L.year] === L.user;

/* ---------- actions ---------- */
function storeImport(res, year) {
  if (res.kind === 'draft') {
    if (!year || year < 1976 || year > 2040) throw new Error('Set the draft year first.');
    IM.drafts[year] = res.rows; return `Imported ${res.rows.length} picks for the ${year} draft.`;
  }
  const bucket = res.kind === 'adv' ? IM.adv : IM.pg;
  bucket[res.league] = res.rows;
  return `Imported ${res.league} ${res.kind === 'adv' ? 'advanced' : 'per-game'} stats: ${res.rows.length} rows, ${res.codes.length} teams (${res.codes.join(', ')}).`;
}
async function onFiles(files) {
  const out = [];
  for (const f of files) {
    const text = await f.text();
    try {
      const res = G.parseBRef(text);
      const y = +((f.name.match(/(19|20)\d\d/) || [])[0] || 0);
      if (res.kind === 'draft' && !y) { out.push(`${f.name}: include the year in the name, like draft1977.csv.`); continue; }
      storeImport(res, y);
      out.push(res.kind === 'draft' ? `draft ${y} ✓` : `${res.league} ${res.kind === 'adv' ? 'advanced' : 'per game'} ✓`);
    } catch (e) { out.push(`${f.name}: ${e.message}`); }
  }
  flash(out.join(' · ')); save(); render();
}

    case 'stYear': ui.stYear = +id; break;
    case 'tsSort': ui.tsSort = id || 'w'; break;
    case 'statPlayer': ui.statPid = id ? +id : null; if (id) { ui.tab = 'stats'; ui.box = null; window.scrollTo(0, 0); } break;
    case 'hurt': { const p = L.players[+id]; const e = G.setPlayHurt(L, +id, !p.playHurt); if (e) flash(e); else flash(p.playHurt ? `${p.name} will play through the injury.` : `${p.name} will rest until healthy.`); break; }
    case 'importFut': {
      try {
        const y = +(ui.futYear || 1979), res = G.parseBRef($('#futText').value);
        if (res.kind !== 'pergame') throw new Error('That is not a per-game table. Use the leagues/NBA_' + y + '_per_game.html page.');
        if (y < 1977 || y > 1990) throw new Error('Set a season ending year between 1977 and 1990.');
        IM.future = IM.future || {}; IM.future[y] = res.rows;
        flash(`Imported the ${y - 1}-${String(y).slice(2)} season: ${res.rows.length} rows. Start a new league to use it.`);
      } catch (e) { flash(e.message); }
      break;
    }
    case 'import': {
      const text = $('#impText').value;
      try { flash(storeImport(G.parseBRef(text), +ui.impYear)); } catch (e) { flash(e.message); }
      break;
    }
    case 'exportSave': {
      const blob = new Blob([JSON.stringify({ app: 'hardwood-gm', league: L, imports: IM })], { type: 'application/json' });
      const a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob); a2.download = `hardwood-gm-${L.year}.json`;
      document.body.appendChild(a2); a2.click(); a2.remove();
      flash('Backup created. If nothing downloaded, open the installed app rather than this preview.');
      break;
    }
    default: return;
  }
  if (a !== 'confirm') ui.confirm = null;
  if (L) G.prepClass(L, IM);
  save(); render();
}

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.dataset.act, el); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'tGrp-give' || t.id === 'tGrp-get') { ui[t.id === 'tGrp-give' ? 'tGrpGive' : 'tGrpGet'] = t.value; render(); }
  else if (t.id === 'planDef') { G.setGamePlan(L, 'def', t.value || null); save(); render(); }
  else if (t.id === 'blockPos') { ui.blockPos = t.value; render(); }
  else if (t.id === 'planOff') { G.setGamePlan(L, 'off', t.value || null); save(); render(); }
  else if (t.id === 'tradeTeam') { ui.tradeTeam = +t.value; ui.get = []; render(); }
  else if (t.id === 'tempo') { me().coach.tempo = +t.value; save(); render(); }
  else if (t.id === 'youth') { me().coach.youth = t.checked; save(); }
  else if (t.id === 'pickTeam') ui.newTeam = t.value;
  else if (t.id === 'recScope') { ui.recScope = t.value; render(); }
  else if (t.id === 'impYear') ui.impYear = +t.value;
  else if (t.id === 'futYear') ui.futYear = +t.value;
  else if (t.id === 'impFiles' && t.files.length) onFiles([...t.files]);
  else if (t.id === 'loadSave' && t.files[0]) {
    t.files[0].text().then(s => {
      try { const o = JSON.parse(s); if (!o.league || !o.league.teams || o.league.sport !== 'nba') throw 0; L = o.league; G.ensureLeague(L); IM = o.imports || IM; G.rescoreDraft(L, IM); ui.tab = 'home'; flash(`Restored your ${SL(L.year)} league.`); save(); }
      catch (err) { flash('That file is not a Hardwood GM backup.'); }
      render();
    });
  }
});
document.addEventListener('input', e => { if (e.target.id === 'tempo') { const h = e.target.closest('.card').querySelector('h3'); if (h) h.textContent = 'Tempo: ' + e.target.value; } });

(async function boot() {
  await DB.open();
  const [l, im] = await Promise.all([DB.get('league'), DB.get('imports')]);
  if (im && im.pg) IM = Object.assign({ pg: {}, adv: {}, drafts: {}, future: {} }, im);
  if (l && l.teams) { L = l; G.ensureLeague(L); if (G.rescoreDraft(L, IM) | G.prepClass(L, IM)) save(); }
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.host)) {
    try { navigator.serviceWorker.register('sw.js'); } catch (e) { /* offline install unavailable */ }
  }
})();
})();

</script>
</body>
